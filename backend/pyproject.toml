[project]
name = "seka-backend"
version = "0.1.0"
description = "Backend FastAPI pour la plateforme SEKA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "psycopg[binary,pool]==3.1.18",
    "alembic==1.13.2",
    "pydantic-settings==2.3.3",
    "python-multipart==0.0.9",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.3",
    "celery[redis]==5.4.0",
    "redis==5.0.4",
    "boto3==1.34.131",
    "httpx==0.27.0",
    "structlog==24.2.0",
    "sentry-sdk[fastapi]==2.10.0"
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
