version: '3'

services:
  appsmith:
    image: appsmith/appsmith-ce:latest
    container_name: appsmith
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./stacks:/appsmith-stacks
    environment:
      - APPSMITH_ENCRYPTION_PASSWORD=${APPSMITH_ENCRYPTION_PASSWORD}
      - APPSMITH_ENCRYPTION_SALT=${APPSMITH_ENCRYPTION_SALT}
      - APPSMITH_MONGODB_URI=mongodb://mongo:27017/appsmith
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:5.0
    container_name: appsmith-mongo
    volumes:
      - ./mongo-data:/data/db
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: seka-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=seka
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: seka-backend
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/seka"
      SECRET_KEY: "changeme"
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - db


